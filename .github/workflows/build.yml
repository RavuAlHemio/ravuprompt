name: ravuprompt build
on: [push]
jobs:
  build-debug:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: update packages
        run: pacman -Syu --noconfirm
      - name: install packages
        run: pacman -S --needed --noconfirm git rustup
      - name: install rust
        run: rustup toolchain install stable
      - name: check out repository code
        uses: actions/checkout@v4
      - name: run build
        run: cargo build
      - name: run tests
        run: cargo test
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ravuprompt-debug
          path: |
            zshrc
            target/debug/ravuprompt
  build-release:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: update packages
        run: pacman -Syu --noconfirm
      - name: install packages
        run: pacman -S --needed --noconfirm git rustup
      - name: install rust
        run: rustup toolchain install stable
      - name: check out repository code
        uses: actions/checkout@v4
      - name: run build
        run: cargo build --release
      - name: run tests
        run: cargo test --release
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ravuprompt-release
          path: |
            zshrc
            target/release/ravuprompt
  build-release-musl:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      RUST_BACKTRACE: 1
    steps:
      - name: update packages
        run: pacman -Syu --noconfirm
      - name: install packages
        run: pacman -S --needed --noconfirm git rustup
      - name: install rust
        run: rustup toolchain install stable --target=x86_64-unknown-linux-musl
      - name: check out repository code
        uses: actions/checkout@v4
      - name: run build
        run: cargo build --release --target=x86_64-unknown-linux-musl
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: ravuprompt-release-musl
          path: |
            zshrc
            target/x86_64-unknown-linux-musl/release/ravuprompt
